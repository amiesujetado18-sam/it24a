<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Todo List</h1>
   <input type="text"
            id="taskInput"
            placeholder="Add a task"
   />
   <button onclick="addTask()">Add Task</button>
   <ul id="taskList">Your task go here ...</ul>

 <script>

function getTaskTest(){
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    console.log("The Input value is: " + input.value);
    return text;
}

function addTask(){
    const taskText = getTaskTest();
    addTaskItem(taskText);

}

function addTaskItem(taskText){
    const li = document.createElement("li");
    const taskSpan = document.createElement("span");
    taskSpan.textContent = taskText;
    li.appendChild(taskSpan);

    document.getElementById("taskList").appendChild(li)

    // Call createDoneButton() function
    const doneBtn = createDoneButton(li);
    li.appendChild(doneBtn);
}
function createDoneButton(li){
    const doneBtn = document.createElement("button");
    doneBtn.textContent = "Done";

    doneBtn.onclick = () => {
        console.log(li);
        li.classList.add("Done");

        const button = li.querySelectorAll("button");

        button.forEach(btn => {
            btn.disabled = true;
        });

        console.log("Task Completed", li.textContent, Date());
    }

    return doneBtn;
}
   </script>

</body>
</html>
